<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#168d98" />
    <title>Offline · AGOS</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f4f8f8; color: #0f2a2e; padding: 16px; box-sizing: border-box; }
      main { max-width: 360px; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 16px; }
      p { color: #4a6064; line-height: 1.5; }
      button { background: #168d98; color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; font-size: 16px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>This page hasn't been opened on this device yet. Pages you've visited and the barangay form still work offline; forms sync when you reconnect.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
